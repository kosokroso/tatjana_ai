<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurivo Gorica — testni klepet</title>
<style>
  /* Nevtralna črno-bela paleta, skladna s klasično Astra temo (brez barvnega poudarka). */
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #101012;
    --muted: #6b6b6b;
    --line: #e1e1e1;
    --accent: #101012;
    --accent-contrast: #ffffff;
    --accent-soft: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --panel: #1a1a1a;
      --ink: #f2f2f2;
      --muted: #9a9a9a;
      --line: #333333;
      --accent: #f2f2f2;
      --accent-contrast: #101012;
      --accent-soft: #262626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 680px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  #log {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    height: 58vh;
    min-height: 320px;
    overflow-y: auto;
  }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .msg .body { white-space: pre-wrap; }
  .msg.user .body {
    background: var(--accent-soft);
    padding: 8px 12px;
    border-radius: 4px;
    align-self: flex-start;
  }
  .msg.error .body { color: #b00020; font-weight: 600; }
  .tools {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] {
    flex: 1;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    color: var(--ink);
    font: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  button {
    padding: 11px 20px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    background: var(--accent);
    color: var(--accent-contrast);
    font: inherit;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .samples button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 400;
    padding: 5px 10px;
    border-radius: 3px;
  }
  footer { margin-top: 14px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Kurivo Gorica — testni klepet</h1>
  <p class="sub">Besedilni test asistenta pred glasovno različico. Pod vsakim odgovorom piše, katera orodja je uporabil.</p>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Napišite vprašanje…" autocomplete="off" required>
    <button type="submit" id="send">Pošlji</button>
  </form>

  <div class="samples" id="samples"></div>

  <footer>
    Pogovor se ob osvežitvi strani izbriše. Klici se beležijo v <code>logs/</code>.
    <button type="button" id="reset" style="background:transparent;border:0;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;cursor:pointer">Počisti pogovor</button>
  </footer>
</main>

<script>
const ENDPOINT = 'ai/chat.php';

const SAMPLES = [
  'Koliko stanejo bukova drva?',
  'Imate pelete na zalogi?',
  'Do kdaj ste danes odprti?',
  'Kam vse dostavljate?',
  'Kako lahko plačam?',
  'Zanima me naročilo 10005',
];

const logEl = document.getElementById('log');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

let history = [];

function addMessage(role, text, tools) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'Vi' : role === 'error' ? 'Napaka' : 'Asistent';

  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;

  wrap.append(who, body);

  if (tools && tools.length) {
    const t = document.createElement('div');
    t.className = 'tools';
    t.textContent = '→ orodja: ' + tools.join(', ');
    wrap.append(t);
  }

  logEl.append(wrap);
  logEl.scrollTop = logEl.scrollHeight;
}

async function send(text) {
  addMessage('user', text);
  history.push({ role: 'user', content: text });

  sendEl.disabled = true;
  sendEl.textContent = '…';

  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });

    const payload = await res.json();

    if (!payload.success) {
      addMessage('error', payload.error || 'Neznana napaka.');
      return;
    }

    addMessage('assistant', payload.data.reply, payload.data.tools_used);
    history.push({ role: 'assistant', content: payload.data.reply });
  } catch (err) {
    addMessage('error', 'Strežnik ni dosegljiv: ' + err.message);
  } finally {
    sendEl.disabled = false;
    sendEl.textContent = 'Pošlji';
    inputEl.focus();
  }
}

formEl.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  send(text);
});

document.getElementById('reset').addEventListener('click', () => {
  history = [];
  logEl.innerHTML = '';
  inputEl.focus();
});

const samplesEl = document.getElementById('samples');
SAMPLES.forEach((text) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  b.addEventListener('click', () => send(text));
  samplesEl.append(b);
});
</script>
</body>
</html>
