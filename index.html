<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Asistent — Kreativni Splet</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #6f6f6f;
    --line: #e6e6e6;
    --accent: #bf6c2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 72px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0; flex-wrap: wrap; gap: 12px;
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  h1 {
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 300; letter-spacing: -.02em;
    text-align: center; margin: 44px 0 10px;
  }
  .sub { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 40px; }
  footer {
    margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kreativni Splet</div>
    <nav><a href="https://kreativnisplet.si/">Nazaj na stran</a></nav>
  </header>

  <h1>Te kaj zanima?</h1>
  <p class="sub">Vprašajte o ponudbi, cenah ali rokih izdelave. Za ponudbo pustite kontakt.</p>

  <div id="tatjana-chat"></div>

  <footer>
    Testna stran asistenta. Ni povezana iz menija in ni indeksirana.
  </footer>
</div>

<script src="widget.js" defer></script>
</body>
</html>
