<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatjana AI — klepet</title>
<style>
  /* Paleta povzeta po spletni strani: bela podlaga, skoraj črno besedilo,
     topla oranžna za povezave, črn zaobljen gumb. Stran je namenoma samo
     svetla, ker je taka tudi glavna stran. */
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #6f6f6f;
    --line: #e6e6e6;
    --accent: #bf6c2c;
    --bubble: #f5f4f2;
    --btn: #111111;
    --btn-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 0;
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  header nav a { font-size: 15px; }

  h1 {
    font-size: clamp(34px, 6vw, 56px);
    font-weight: 300;
    letter-spacing: -.02em;
    text-align: center;
    margin: 48px 0 8px;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 40px;
  }

  #log {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    height: 52vh;
    min-height: 300px;
    overflow-y: auto;
  }
  #log:empty::after {
    content: "Vprašanja o ponudbi, cenah, dostavi ali naročilu.";
    color: var(--muted);
    font-size: 14px;
  }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; gap: 5px; }
  .msg .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .msg .body { white-space: pre-wrap; }
  .msg.user .body {
    background: var(--bubble);
    padding: 10px 15px;
    border-radius: 14px;
    align-self: flex-start;
    max-width: 85%;
  }
  .msg.error .body { color: #b3261e; }
  .tools {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  form { display: flex; gap: 10px; margin-top: 18px; }
  input[type=text] {
    flex: 1;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--ink);
  }
  button {
    padding: 14px 30px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }

  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .samples button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--accent);
    font-size: 14px;
    padding: 8px 16px;
  }
  .samples button:hover { border-color: var(--accent); }

  footer {
    margin: 56px 0 40px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  footer .brand { font-size: 17px; }
  footer button {
    background: transparent;
    color: var(--accent);
    padding: 0;
    font-size: 13px;
    border-radius: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Tatjana AI</div>
    <nav><a href="../">Domov</a></nav>
  </header>

  <h1>Te kaj zanima?</h1>
  <p class="sub">Pod vsakim odgovorom piše, katere podatke je asistent preveril.</p>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Napišite vprašanje…" autocomplete="off" required>
    <button type="submit" id="send">Povprašaj</button>
  </form>

  <div class="samples" id="samples"></div>

  <footer>
    <div class="brand">Tatjana AI</div>
    <div>
      Pogovor se ob osvežitvi izbriše.
      <button type="button" id="reset">Počisti pogovor</button>
    </div>
  </footer>
</div>

<script>
const ENDPOINT = 'ai/chat.php';

const SAMPLES = [
  'Koliko stanejo bukova drva?',
  'Imate pelete na zalogi?',
  'Do kdaj ste danes odprti?',
  'Kam vse dostavljate?',
  'Kako lahko plačam?',
  'Zanima me naročilo 10005',
];

const logEl = document.getElementById('log');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');

let history = [];

function addMessage(role, text, tools) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'Vi' : role === 'error' ? 'Napaka' : 'Tatjana';

  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;

  wrap.append(who, body);

  if (tools && tools.length) {
    const t = document.createElement('div');
    t.className = 'tools';
    t.textContent = 'preverjeno: ' + tools.join(', ');
    wrap.append(t);
  }

  logEl.append(wrap);
  logEl.scrollTop = logEl.scrollHeight;
}

async function send(text) {
  addMessage('user', text);
  history.push({ role: 'user', content: text });

  sendEl.disabled = true;
  sendEl.textContent = '…';

  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });

    const payload = await res.json();

    if (!payload.success) {
      addMessage('error', payload.error || 'Neznana napaka.');
      return;
    }

    addMessage('assistant', payload.data.reply, payload.data.tools_used);
    history.push({ role: 'assistant', content: payload.data.reply });
  } catch (err) {
    addMessage('error', 'Strežnik ni dosegljiv: ' + err.message);
  } finally {
    sendEl.disabled = false;
    sendEl.textContent = 'Povprašaj';
    inputEl.focus();
  }
}

formEl.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  send(text);
});

document.getElementById('reset').addEventListener('click', () => {
  history = [];
  logEl.innerHTML = '';
  inputEl.focus();
});

const samplesEl = document.getElementById('samples');
SAMPLES.forEach((text) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  b.addEventListener('click', () => send(text));
  samplesEl.append(b);
});
</script>
</body>
</html>
