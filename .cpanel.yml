---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kreati02/tatjana.kreativnisplet.si/AiAssistant_v1/
    # Brez --chmod bi rsync -a prenesel pravice izvorne mape: cPanel git repozitorij
    # je 0700, spletni streznik pa v tako mapo ne more vstopiti in vrne 404 na vseh
    # datotekah. D755/F644 sta pravici, ki jih Apache/LiteSpeed potrebuje.
    - /usr/bin/rsync -rlt --chmod=D755,F644 --exclude='.git' --exclude='.cpanel.yml' --exclude='config.php' --exclude='logs/*.log' ./ $DEPLOYPATH
    - /bin/chmod 755 $DEPLOYPATH
