<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glasovni preizkus — Kreativni Splet</title>
<style>
  :root {
    --bg: #fdf9f5; --panel: #ffffff; --ink: #23201d; --muted: #8a8079;
    --line: #ece3d8; --accent: #e8943a; --teal: #3aaecf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Segoe UI", -apple-system, Roboto, system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 12px;
  }
  .brand { font-weight: 800; }
  .brand span { color: var(--teal); }
  a { color: var(--accent); text-decoration: none; }
  h1 {
    font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -.03em;
    text-align: center; color: var(--teal); margin: 44px 0 10px;
  }
  .sub { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 32px; }

  .mic {
    display: block; margin: 0 auto 10px; width: 132px; height: 132px;
    border-radius: 50%; border: 0; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(232,148,58,.35);
  }
  .mic.snema { background: #c0392b; animation: utrip 1.2s infinite; }
  .mic[disabled] { opacity: .5; cursor: default; animation: none; }
  @keyframes utrip { 50% { box-shadow: 0 8px 40px rgba(192,57,43,.6); } }
  .stanje { text-align: center; color: var(--muted); font-size: 14px; min-height: 24px; margin-bottom: 26px; }

  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 24px; }
  .msg { margin: 0 0 18px; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  .msg.bot .who { color: var(--teal); }
  .msg.err .body { color: #c0392b; }
  .body { margin: 0; white-space: pre-wrap; }
  .cas { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; margin: 4px 0 0; }
  .log:empty::after { content: "Pritisni gumb in govori."; color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kreativni <span>Splet</span></div>
    <nav><a href="./">Besedilni klepet</a></nav>
  </header>

  <h1>Glasovni preizkus</h1>
  <p class="sub">Govori po slovensko. Meri se, kako dobro te sistem razume in kako zveni odgovor.</p>

  <button class="mic" id="mic">Govori</button>
  <p class="stanje" id="stanje">Pripravljen</p>

  <div class="log" id="log"></div>

  <footer>
    Vsak krog stane nekaj centov: prepis govora, odgovor asistenta in sinteza govora.
    Stran ni povezana iz menija in ni indeksirana.
  </footer>
</div>

<script>
const micEl = document.getElementById('mic');
const stanjeEl = document.getElementById('stanje');
const logEl = document.getElementById('log');

let snemalnik = null;
let kosi = [];
let zgodovina = [];

function zapis(vloga, besedilo, cas) {
  const el = document.createElement('div');
  el.className = 'msg ' + vloga;

  const kdo = document.createElement('p');
  kdo.className = 'who';
  kdo.textContent = vloga === 'user' ? 'Ti' : vloga === 'err' ? 'Napaka' : 'Tatjana';

  const telo = document.createElement('p');
  telo.className = 'body';
  telo.textContent = besedilo;

  el.append(kdo, telo);

  if (cas) {
    const c = document.createElement('p');
    c.className = 'cas';
    c.textContent = cas;
    el.append(c);
  }

  logEl.append(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}

micEl.addEventListener('click', async () => {
  if (snemalnik && snemalnik.state === 'recording') {
    snemalnik.stop();
    return;
  }

  let tok;
  try {
    tok = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    zapis('err', 'Dostop do mikrofona ni bil dovoljen.');
    return;
  }

  kosi = [];
  snemalnik = new MediaRecorder(tok);
  snemalnik.ondataavailable = (e) => { if (e.data.size) kosi.push(e.data); };
  snemalnik.onstop = async () => {
    tok.getTracks().forEach((t) => t.stop());
    micEl.classList.remove('snema');
    micEl.textContent = 'Govori';
    await obdelaj(new Blob(kosi, { type: 'audio/webm' }));
  };

  snemalnik.start();
  micEl.classList.add('snema');
  micEl.textContent = 'Končaj';
  stanjeEl.textContent = 'Snemam…';
});

async function obdelaj(blob) {
  micEl.disabled = true;
  const zacetek = performance.now();

  try {
    stanjeEl.textContent = 'Prepisujem govor…';
    const fd = new FormData();
    fd.append('audio', blob, 'posnetek.webm');
    const rSTT = await fetch('ai/transcribe.php', { method: 'POST', body: fd });
    const pSTT = await rSTT.json();
    if (!pSTT.success) { zapis('err', pSTT.error || 'Prepis ni uspel.'); return; }

    const vprasanje = pSTT.data.text;
    const casSTT = Math.round(performance.now() - zacetek);
    if (!vprasanje) { zapis('err', 'Ničesar nisem slišala.'); return; }
    zapis('user', vprasanje, 'prepis: ' + casSTT + ' ms');

    stanjeEl.textContent = 'Razmišljam…';
    zgodovina.push({ role: 'user', content: vprasanje });
    const t2 = performance.now();
    const rChat = await fetch('ai/chat.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: zgodovina })
    });
    const pChat = await rChat.json();
    if (!pChat.success) { zapis('err', pChat.error || 'Odgovor ni uspel.'); return; }

    const odgovor = pChat.data.reply;
    zgodovina.push({ role: 'assistant', content: odgovor });
    const casChat = Math.round(performance.now() - t2);
    const orodja = pChat.data.tools_used && pChat.data.tools_used.length
      ? ', orodja: ' + pChat.data.tools_used.join(', ') : '';
    zapis('bot', odgovor, 'odgovor: ' + casChat + ' ms' + orodja);

    stanjeEl.textContent = 'Pripravljam govor…';
    const t3 = performance.now();
    const rTTS = await fetch('ai/speak.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: odgovor })
    });

    if (!rTTS.ok || !(rTTS.headers.get('content-type') || '').includes('audio')) {
      const p = await rTTS.json().catch(() => ({}));
      zapis('err', p.error || 'Sinteza govora ni uspela.');
      return;
    }

    const zvok = new Audio(URL.createObjectURL(await rTTS.blob()));
    const casTTS = Math.round(performance.now() - t3);
    stanjeEl.textContent = 'Skupaj ' + Math.round(performance.now() - zacetek) + ' ms (govor: ' + casTTS + ' ms)';
    zvok.play();
  } catch (e) {
    zapis('err', 'Napaka: ' + e.message);
  } finally {
    micEl.disabled = false;
    if (stanjeEl.textContent.indexOf('ms') === -1) stanjeEl.textContent = 'Pripravljen';
  }
}
</script>
</body>
</html>
