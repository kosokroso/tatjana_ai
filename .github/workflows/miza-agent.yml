# Deploy restavracijskega agenta (tatjana-miza) v LiveKit projekt "miza".
#
# Zakaj na GitHubu: na Lukovem računalniku Windows Application Control
# blokira lk.exe. Tu lk teče na GitHubovem Linuxu.
#
# Zagon: Actions -> "Agent miza" -> Run workflow -> create (prvič) ali deploy.
#
# Skrivnost MIZA_ENV: celotna vsebina voice-agent/.env.miza (Settings ->
# Secrets and variables -> Actions). Repo je javen, zato se vsebina nikoli ne
# izpiše; GitHub vrednosti skrivnosti v dnevniku prekrije.
# Spremenljivka MIZA_AGENT_ID: ID agenta (CA_...), ki ga izpiše "create".
#
# Tatjane (agent.py, projekt tatjana) ta workflow ne spreminja.

name: Agent miza

on:
  workflow_dispatch:
    inputs:
      dejanje:
        description: "create = prvič ustvari agenta; deploy = nova verzija"
        required: true
        default: deploy
        type: choice
        options: [deploy, create, logs, check, docker]

permissions:
  contents: read

concurrency:
  group: miza-agent
  cancel-in-progress: false

jobs:
  miza:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    steps:
      - uses: actions/checkout@v4

      - name: Testi pravil (brez LiveKita)
        run: python3 test_miza.py

      - name: Namesti LiveKit CLI
        working-directory: .
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Nastavitve iz skrivnosti
        env:
          MIZA_ENV: ${{ secrets.MIZA_ENV }}
        run: |
          if [ -z "$MIZA_ENV" ]; then echo "Manjka skrivnost MIZA_ENV."; exit 1; fi
          printf '%s\n' "$MIZA_ENV" | tr -d '\r' > .env.miza
          # Vsako vrednost najprej prekrijemo. GitHub prekrije samo celotno
          # skrivnost MIZA_ENV, ne posameznih vrstic, ki jih zapišemo v
          # GITHUB_ENV; brez add-mask se te izpišejo v javni dnevnik
          # (24. 11. 2026 se je tako izpisal LIVEKIT_API_SECRET).
          while IFS='=' read -r k v; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done < <(grep -E '^[A-Z_][A-Z0-9_]*=' .env.miza)
          # lk se prijavi s ključi projekta miza, ne s privzetim projektom.
          grep -E '^LIVEKIT_(URL|API_KEY|API_SECRET)=' .env.miza >> "$GITHUB_ENV"
          grep -q '^AGENT_ZAGON=restavracija.py' .env.miza || { echo "AGENT_ZAGON mora biti restavracija.py"; exit 1; }

      - name: Ustvari agenta (prvič)
        if: inputs.dejanje == 'create'
        run: |
          lk --config livekit-miza.toml agent create --region eu-central --secrets-file .env.miza .
          echo "Shrani ID agenta (CA_...) iz zgornje vrstice kot spremenljivko MIZA_AGENT_ID."

      - name: Nova verzija
        if: inputs.dejanje == 'deploy'
        env:
          AGENT_ID: ${{ vars.MIZA_AGENT_ID }}
        run: |
          if [ -z "$AGENT_ID" ]; then echo "Manjka spremenljivka MIZA_AGENT_ID."; exit 1; fi
          lk agent deploy --id "$AGENT_ID" --secrets-file .env.miza .

      # Repo je javen in dnevnik GitHub Actions tudi. Zato samo stanje in prvih
      # 45 s dnevnika (zagon), s skritimi telefonskimi številkami. Za klice
      # pravih gostov tega ne uporabljaj.
      - name: Stanje in dnevnik zagona
        if: inputs.dejanje == 'logs'
        env:
          AGENT_ID: ${{ vars.MIZA_AGENT_ID }}
        run: |
          if [ -z "$AGENT_ID" ]; then echo "Manjka spremenljivka MIZA_AGENT_ID."; exit 1; fi
          lk agent status --id "$AGENT_ID" || true
          echo "--- build"
          timeout 30 lk agent logs --id "$AGENT_ID" --log-type build 2>&1 | tail -n 40 || true
          echo "--- deploy"
          timeout 45 lk agent logs --id "$AGENT_ID" 2>&1 | sed -E 's/\+?[0-9][0-9 ]{7,}[0-9]/[tel]/g' | tail -n 80 || true

      # Zažene agenta tukaj za 25 s, z istimi nastavitvami kot v oblaku.
      # Pokaže napako ob zagonu, ki je dnevnik LiveKita ne izpiše. V tem času
      # je v projektu miza en delavec več; klici ta čas lahko pridejo sem.
      - name: Preizkus zagona
        if: inputs.dejanje == 'check'
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r requirements.txt
          # .env.miza prebere restavracija.py sama (load_dotenv), lupina je ne bere.
          /tmp/venv/bin/python -c "import restavracija; print('uvoz ok')"
          timeout 25 /tmp/venv/bin/python restavracija.py start 2>&1 | sed -E 's/\+?[0-9][0-9 ]{7,}[0-9]/[tel]/g' | tail -n 60 || true

      # Ista slika kot v LiveKit Cloud (Dockerfile), zagnana tukaj za 40 s.
      # Pokaže napako, ki se zgodi samo v kontejnerju (pravice, pot, CMD).
      - name: Preizkus Docker slike
        if: inputs.dejanje == 'docker'
        run: |
          docker build -q -t miza-agent . > /dev/null
          grep -E '^[A-Z_][A-Z0-9_]*=' .env.miza > /tmp/miza.envfile
          timeout 40 docker run --rm --env-file /tmp/miza.envfile miza-agent 2>&1 | sed -E 's/\+?[0-9][0-9 ]{7,}[0-9]/[tel]/g' | tail -n 60 || true
          rm -f /tmp/miza.envfile

      - name: Pobriši nastavitve
        if: always()
        run: rm -f .env.miza livekit-miza.toml
